<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>|</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .calculator {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 280px;
        }
        .calculator h2 {
            margin-top: 0;
            text-align: center;
            color: #333;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #222;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Калькулятор</h2>
    <input type="number" id="num1" placeholder="Первое число">
    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <input type="number" id="num2" placeholder="Второе число">
    <button onclick="calculate()">Посчитать</button>
    <div id="result">Результат: -</div>
</div>

<script>
    function calculate() {
        const n1 = parseFloat(document.getElementById('num1').value);
        const n2 = parseFloat(document.getElementById('num2').value);
        const op = document.getElementById('operator').value;
        let res = 0;

        if (isNaN(n1) || isNaN(n2)) {
            document.getElementById('result').innerText = "Введите числа!";
            return;
        }

        switch (op) {
            case '+': res = n1 + n2; break;
            case '-': res = n1 - n2; break;
            case '*': res = n1 * n2; break;
            case '/': res = n2 !== 0 ? n1 / n2 : 'Ошибка'; break;
        }

        document.getElementById('result').innerText = "Результат: " + res;
    }
</script>

</body>
</html>
